<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nook 10.0 Visual Overhaul</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #030305;
      --liquid-card: rgba(18, 18, 26, 0.78);
      --liquid-specular: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.03) 45%, rgba(255, 255, 255, 0.08) 100%);
      --liquid-border: rgba(255, 255, 255, 0.16);
      --liquid-border-strong: rgba(255, 255, 255, 0.45);
      --text: #ffffff;
      --muted: #9ca3af;
      --danger: #ff453a;
      --success: #30d158;
      --accent: #0a84ff;
      --check-blue: #38bdf8;
      --orb-1: #6366f1;
      --orb-2: #ec4899;
      --radius-2xl: 32px;
      --radius-xl: 22px;
      --radius-pill: 9999px;
      --ios-spring: cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* РАДИКАЛЬНЫЕ ЯРКИЕ ТЕМЫ */
    body.theme-oled {
      --bg: #000000;
      --liquid-card: rgba(18, 18, 22, 0.85);
      --accent: #ffffff;
      --orb-1: #3b82f6;
      --orb-2: #8b5cf6;
      --liquid-border: rgba(255, 255, 255, 0.14);
    }
    body.theme-cyber {
      --bg: #0c031c;
      --liquid-card: rgba(30, 12, 60, 0.82);
      --accent: #00f0ff;
      --orb-1: #d946ef;
      --orb-2: #06b6d4;
      --liquid-border: rgba(0, 240, 255, 0.3);
      --liquid-border-strong: rgba(217, 70, 239, 0.6);
    }
    body.theme-space {
      --bg: #020b1e;
      --liquid-card: rgba(10, 28, 64, 0.82);
      --accent: #38bdf8;
      --orb-1: #2563eb;
      --orb-2: #0284c7;
      --liquid-border: rgba(56, 189, 248, 0.3);
      --liquid-border-strong: rgba(56, 189, 248, 0.6);
    }
    body.theme-crimson {
      --bg: #180205;
      --liquid-card: rgba(52, 10, 18, 0.82);
      --accent: #ff334b;
      --orb-1: #ef4444;
      --orb-2: #b91c1c;
      --liquid-border: rgba(255, 51, 75, 0.32);
      --liquid-border-strong: rgba(255, 51, 75, 0.65);
    }
    body.theme-matrix {
      --bg: #021207;
      --liquid-card: rgba(8, 40, 18, 0.82);
      --accent: #10b981;
      --orb-1: #059669;
      --orb-2: #34d399;
      --liquid-border: rgba(16, 185, 129, 0.32);
      --liquid-border-strong: rgba(52, 211, 153, 0.65);
    }
    body.theme-gold-hq {
      --bg: #141002;
      --liquid-card: rgba(45, 36, 10, 0.85);
      --accent: #ffd700;
      --orb-1: #f59e0b;
      --orb-2: #d97706;
      --liquid-border: rgba(255, 215, 0, 0.35);
      --liquid-border-strong: rgba(255, 215, 0, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      position: relative;
      transition: background 0.35s var(--ios-spring);
    }

    .ambient-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.42;
      animation: floatOrb 18s ease-in-out infinite alternate;
      transition: background 0.5s ease;
    }
    .orb-1 { width: 420px; height: 420px; background: radial-gradient(circle, var(--orb-1), transparent 70%); top: -100px; left: 10%; }
    .orb-2 { width: 440px; height: 440px; background: radial-gradient(circle, var(--orb-2), transparent 70%); bottom: -120px; right: -60px; animation-duration: 22s; }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 30px) scale(1.1); }
      100% { transform: translate(-30px, 50px) scale(0.95); }
    }

    header {
      position: relative;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(12, 12, 16, 0.82);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-bottom: 1px solid var(--liquid-border);
      transition: border-color 0.3s;
    }
    .brand-wrap { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .brand-logo { font-weight: 900; font-size: 22px; letter-spacing: -0.05em; color: #fff; }
    .brand-tag { font-size: 9px; font-weight: 900; color: #000; background: #fff; padding: 2px 7px; border-radius: var(--radius-pill); }

    .header-right { display: flex; align-items: center; gap: 10px; }
    .btn-settings-gear {
      background: var(--liquid-specular);
      border: 1px solid var(--liquid-border);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(20px);
      transition: transform 0.2s var(--ios-spring), border-color 0.3s;
    }
    .btn-settings-gear:active { transform: scale(0.9); }
    .btn-settings-gear svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    .user-pill-liquid {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
      background: var(--liquid-specular);
      backdrop-filter: blur(20px);
      padding: 5px 12px 5px 5px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--liquid-border);
      cursor: pointer;
    }
    .user-avatar-round {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #1e1e24;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
    }
    .verified-icon { width: 15px; height: 15px; fill: #fff; display: none; }

    main { flex: 1; overflow: hidden; position: relative; z-index: 10; }
    .view {
      display: none; height: 100%; opacity: 0; transform: scale(0.98) translateY(8px);
      transition: opacity 0.28s var(--ios-spring), transform 0.28s var(--ios-spring);
    }
    .view.active { display: flex; opacity: 1; transform: scale(1) translateY(0); }

    /* ТЕМАТИЧЕСКИЕ ПЛИТКИ ВЫБОРА */
    .theme-grid-selector {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }
    .theme-card-option {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--liquid-border);
      border-radius: var(--radius-xl);
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .theme-card-option.active {
      border-color: #fff;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.12);
    }
    .theme-circle-preview {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    /* Рамки Nitro */
    .frame-none { border: 2px solid transparent; }
    .frame-neon { border: 3px solid #00f0ff; box-shadow: 0 0 14px #00f0ff; }
    .frame-cyber { border: 3px solid #f43f5e; box-shadow: 0 0 16px #f43f5e; border-style: dashed; }
    .frame-fire { border: 3px solid #ff7b00; box-shadow: 0 0 18px #ff3700; }
    .frame-ice { border: 3px solid #7dd3fc; box-shadow: 0 0 16px #38bdf8; }
    .frame-gold { border: 3px solid #fbbf24; box-shadow: 0 0 18px rgba(251, 191, 36, 0.8); }
    .frame-matrix-hq { border: 3px solid #10b981; box-shadow: 0 0 22px #059669; }

    /* Постеры */
    .banner-preview { width: 100%; height: 110px; border-radius: var(--radius-xl) var(--radius-xl) 0 0; background-size: cover; background-position: center; }
    .banner-cyber { background-image: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1518770660439-4636190af475?w=800&q=80'); }
    .banner-space { background-image: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=800&q=80'); }
    .banner-synth { background-image: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=800&q=80'); }
    .b-hq-1 { background-image: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1534447677768-be436bb09401?w=800&q=80'); }

    /* Экраны */
    #view-chats { flex-direction: column; height: 100%; padding: 16px; overflow-y: auto; gap: 14px; }
    .chat-subtabs { display: flex; gap: 8px; background: rgba(255,255,255,0.06); padding: 4px; border-radius: var(--radius-pill); border: 1px solid var(--liquid-border); }
    .chat-subtab-btn { flex: 1; background: transparent; border: none; color: var(--muted); font-size: 13px; font-weight: 800; padding: 8px 12px; border-radius: var(--radius-pill); cursor: pointer; }
    .chat-subtab-btn.active { background: #fff; color: #000; }
    .chat-card-item { display: flex; align-items: center; justify-content: space-between; background: var(--liquid-card); border: 1px solid var(--liquid-border); padding: 14px 16px; border-radius: var(--radius-xl); cursor: pointer; }

    #view-feed { flex-direction: column; height: 100%; overflow-y: auto; padding: 16px; gap: 14px; }
    .liquid-composer-box { background: var(--liquid-card); backdrop-filter: blur(35px); border: 1px solid var(--liquid-border); border-radius: var(--radius-2xl); padding: 16px; }
    .composer-textarea { width: 100%; background: transparent; border: none; color: #fff; font-size: 15px; font-weight: 600; outline: none; resize: none; min-height: 54px; }
    .composer-bottom-bar { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--liquid-border); padding-top: 12px; }
    .btn-pick-liquid { display: flex; align-items: center; gap: 8px; color: #fff; font-size: 13px; font-weight: 800; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--liquid-border); padding: 8px 14px; border-radius: var(--radius-pill); cursor: pointer; }
    .btn-publish-liquid { background: #ffffff; color: #000000; border: none; padding: 10px 22px; border-radius: var(--radius-pill); font-weight: 900; font-size: 14px; cursor: pointer; }

    .liquid-post-card { background: var(--liquid-card); backdrop-filter: blur(35px); border: 1px solid var(--liquid-border); border-radius: var(--radius-2xl); padding: 18px; position: relative; }
    .post-author-row { display: flex; align-items: center; gap: 10px; font-size: 15px; margin-bottom: 10px; cursor: pointer; }
    .post-avatar-img { width: 34px; height: 34px; border-radius: 50%; background: #1c1c1e; object-fit: cover; }
    .post-body-text { font-size: 15px; font-weight: 500; color: #f3f4f6; line-height: 1.45; }
    .post-attached-image { margin-top: 12px; width: 100%; border-radius: var(--radius-xl); border: 1px solid var(--liquid-border); object-fit: cover; display: block; }

    #view-search { flex-direction: column; padding: 16px; overflow-y: auto; gap: 12px; }
    .search-input-box { background: var(--liquid-card); border: 1px solid var(--liquid-border); border-radius: var(--radius-xl); padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
    .search-input-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; font-weight: 700; outline: none; }
    .search-result-item { display: flex; align-items: center; justify-content: space-between; background: var(--liquid-card); border: 1px solid var(--liquid-border); padding: 12px 14px; border-radius: var(--radius-xl); cursor: pointer; }

    #view-admin { flex-direction: column; padding: 16px; overflow-y: auto; gap: 14px; }
    .admin-liquid-card { background: var(--liquid-card); border: 1px solid var(--liquid-border); border-radius: var(--radius-2xl); padding: 18px; }

    footer { position: relative; z-index: 50; display: flex; flex-direction: column; padding: 0 16px 12px; gap: 6px; }
    nav { display: flex; align-items: center; background: rgba(14, 14, 18, 0.85); border: 1px solid var(--liquid-border); backdrop-filter: blur(40px); border-radius: var(--radius-pill); padding: 10px 14px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7); }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: var(--muted); font-size: 11px; font-weight: 800; cursor: pointer; }
    .nav-btn.active { color: #fff; }
    .nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(28px);
      z-index: 100; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-liquid-shell {
      background: rgba(18, 18, 24, 0.94); border: 1px solid var(--liquid-border-strong);
      backdrop-filter: blur(45px); border-radius: var(--radius-2xl); width: 100%; max-width: 400px;
      overflow: hidden; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.9); animation: slideUpIOS 0.32s var(--ios-spring);
    }
    @keyframes slideUpIOS { from { transform: translateY(40px) scale(0.94); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

    .modal-liquid-head { padding: 16px 20px; border-bottom: 1px solid var(--liquid-border); display: flex; align-items: center; justify-content: space-between; font-weight: 900; font-size: 16px; }
    .modal-liquid-body { padding: 20px; max-height: 74dvh; overflow-y: auto; font-size: 14px; }
    .liquid-input-field { margin-bottom: 12px; }
    .liquid-input-field label { display: block; font-size: 11px; font-weight: 800; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; }
    .liquid-input-field input, .liquid-input-field select { width: 100%; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--liquid-border); border-radius: var(--radius-xl); padding: 12px 14px; color: #fff; font-size: 14px; font-weight: 700; outline: none; }
    .btn-liquid-main { width: 100%; background: #ffffff; color: #000000; border: none; padding: 13px; border-radius: var(--radius-pill); font-weight: 900; font-size: 14px; cursor: pointer; margin-top: 6px; }
    .btn-liquid-outline { background: transparent; border: 1px solid var(--liquid-border); color: #fff; }
    .btn-liquid-close { background: none; border: none; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Сообщения */
    .msg-wrapper { display: flex; flex-direction: column; width: 100%; margin-bottom: 8px; position: relative; }
    .msg-bubble { max-width: 82%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-break: break-word; position: relative; cursor: pointer; }
    .msg-bubble.outgoing { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg-bubble.incoming { background: rgba(255,255,255,0.08); border: 1px solid var(--liquid-border); align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg-meta-row { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 10px; color: rgba(255, 255, 255, 0.7); margin-top: 4px; font-weight: 600; }
    .msg-edited-tag { font-size: 9px; opacity: 0.8; font-style: italic; margin-right: 2px; }
    .msg-status-tick { display: inline-flex; align-items: center; }
    .msg-status-tick svg { width: 14px; height: 14px; }
    .tick-unread { stroke: rgba(255,255,255,0.6); }
    .tick-read { stroke: var(--check-blue); }

    .call-system-card {
      align-self: center; background: rgba(255,255,255,0.06); border: 1px solid var(--liquid-border);
      border-radius: var(--radius-pill); padding: 6px 16px; font-size: 12px; font-weight: 700;
      color: #fff; display: flex; align-items: center; gap: 8px; margin: 8px 0;
    }

    #modal-msg-actions { z-index: 600; }
    .msg-action-menu { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .msg-action-btn {
      width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--liquid-border);
      border-radius: var(--radius-xl); padding: 14px; color: #fff; font-size: 14px; font-weight: 800;
      text-align: left; display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    }

    /* Экран звонка */
    #modal-call-screen {
      display: none; position: fixed; inset: 0; background: rgba(8, 8, 12, 0.94); backdrop-filter: blur(50px);
      z-index: 700; flex-direction: column; align-items: center; justify-content: space-between; padding: 56px 20px 48px;
    }
    .call-avatar-pulse-box { position: relative; width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .call-avatar-pulse-box::before {
      content: ''; position: absolute; inset: -12px; border-radius: 50%;
      background: radial-gradient(circle, rgba(10, 132, 255, 0.4), transparent 70%); animation: callWave 2s infinite ease-out;
    }
    @keyframes callWave { 0% { transform: scale(0.9); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
    .call-avatar-img { width: 94px; height: 94px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.4); z-index: 2; }
    .video-call-box { width: 100%; max-width: 380px; height: 48%; border-radius: var(--radius-2xl); overflow: hidden; position: relative; background: #14141c; border: 1px solid var(--liquid-border); }
    #remote-video { width: 100%; height: 100%; object-fit: cover; }
    #local-video { position: absolute; bottom: 12px; right: 12px; width: 86px; height: 124px; border-radius: 16px; object-fit: cover; border: 2px solid rgba(255,255,255,0.7); background: #000; }
    .call-controls-bar { display: flex; align-items: center; gap: 22px; z-index: 10; }
    .call-action-btn { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--liquid-border-strong); background: var(--liquid-specular); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .call-action-btn svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2.2; }
    .call-btn-hangup { width: 68px; height: 68px; background: var(--danger); border: none; }

    #modal-incoming-call {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(40px);
      z-index: 900; flex-direction: column; align-items: center; justify-content: space-between; padding: 60px 24px 50px;
      animation: slideUpIOS 0.3s var(--ios-spring);
    }
    .incoming-pulse-avatar {
      width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #30d158;
      box-shadow: 0 0 25px rgba(48, 209, 88, 0.6); animation: ringPulse 1.2s infinite;
    }
    @keyframes ringPulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

    #toast-box { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); z-index: 950; display: flex; flex-direction: column; gap: 6px; pointer-events: none; width: 90%; max-width: 320px; }
    .toast-liquid { background: rgba(24, 24, 30, 0.96); border: 1px solid var(--liquid-border-strong); backdrop-filter: blur(25px); padding: 12px 18px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 800; color: #fff; text-align: center; }
  </style>
</head>
<body class="theme-oled" onclick="_unlockAudioContext()">

  <div class="ambient-glow">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div id="toast-box"></div>

  <!-- ШТОРКА ВХОДЯЩЕГО ЗВОНКА -->
  <div id="modal-incoming-call">
    <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
      <img id="inc-caller-avatar" class="incoming-pulse-avatar" src="">
      <h2 id="inc-caller-name" style="font-size:24px; font-weight:900;">@user</h2>
      <p style="color:var(--muted); font-size:14px; font-weight:600;">Входящий защищенный вызов...</p>
    </div>

    <div style="display:flex; gap:36px; align-items:center;">
      <button class="call-action-btn" style="width:68px; height:68px; background:var(--danger); border:none;" onclick="_rejectIncomingCall()">
        <svg viewBox="0 0 24 24" style="transform: rotate(135deg);"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </button>
      <button class="call-action-btn" style="width:68px; height:68px; background:var(--success); border:none;" onclick="_acceptIncomingCall()">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </button>
    </div>
  </div>

  <!-- ЭКРАН АКТИВНОГО ЗВОНКА -->

    function _playTone(freq, type = 'sine', duration = 0.8) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function _appendMessageToDOM(m) {
      const cont = document.getElementById('chat-messages-container');
      
      if (m.msg_type === 'call') {
        const callCard = document.createElement('div');
        callCard.id = `msg-${m.id}`;
        callCard.className = 'call-system-card';
        callCard.innerHTML = `<span>${m.encrypted_content}</span> <span style="font-size:10px; opacity:0.6;">${_formatTime(m.created_at)}</span>`;
        cont.appendChild(callCard);
        cont.scrollTop = cont.scrollHeight;
        return;
      }

      const isSelf = m.sender_id === _cu.id;
      const decoded = b58Decode(m.encrypted_content);

      const wrap = document.createElement('div');
      wrap.id = `msg-${m.id}`;
      wrap.className = 'msg-wrapper';
      wrap.style.alignItems = isSelf ? 'flex-end' : 'flex-start';

      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${isSelf ? 'outgoing' : 'incoming'}`;
      bubble.onclick = () => _openMsgActionsMenu(m, isSelf);

      let contentHtml = '';
      if (decoded.startsWith('data:image')) {
        contentHtml = `<img class="msg-media" src="${decoded}">`;
      } else if (decoded.startsWith('data:video')) {
        contentHtml = `<video class="msg-media" src="${decoded}" controls playsinline></video>`;
      } else {
        contentHtml = `<div>${_escapeHtml(decoded)}</div>`;
      }

      let tickHtml = '';
      if (isSelf) {
        if (m.is_read) {
          tickHtml = `<span class="msg-status-tick tick-read"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6"><path d="M18 6L7 17l-5-5"/><path d="M22 10l-7.5 7.5-2-2"/></svg></span>`;
        } else {
          tickHtml = `<span class="msg-status-tick tick-unread"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6"><path d="M20 6L9 17l-5-5"/></svg></span>`;
        }
      }

      bubble.innerHTML = contentHtml + `
        <div class="msg-meta-row">
          ${m.is_edited ? '<span class="msg-edited-tag">изм.</span>' : ''}
          <span>${_formatTime(m.created_at)}</span>
          ${tickHtml}
        </div>
      `;

      wrap.appendChild(bubble);
      cont.appendChild(wrap);
      cont.scrollTop = cont.scrollHeight;
    }

    function _updateMessageInDOM(m) {
      const existing = document.getElementById(`msg-${m.id}`);
      if (existing) {
        existing.remove();
        _appendMessageToDOM(m);
      }
    }

    function _removeMessageFromDOM(msgId) {
      const el = document.getElementById(`msg-${msgId}`);
      if (el) el.remove();
    }

    function _formatTime(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function _escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    async function _submitChatMessage() {
      const inp = document.getElementById('chat-input-text');
      const text = inp.value.trim();
      if (!text || !_activeChatPeerId || !_cu) return;

      if (_editingMsgId) {
        const enc = b58Encode(text);
        await _0xdb.from('direct_messages').update({ encrypted_content: enc, is_edited: true }).eq('id', _editingMsgId);
        _cancelMessageEdit();
      } else {
        inp.value = '';
        await _0xdb.from('direct_messages').insert({
          sender_id: _cu.id, receiver_id: _activeChatPeerId, encrypted_content: b58Encode(text), msg_type: 'text'
        });
      }
    }

    function _handleChatMediaSelect(e) {
      const file = e.target.files[0];
      if (!file || !_activeChatPeerId || !_cu) return;
      if (file.size > 15 * 1024 * 1024) return _toast('Максимум 15 МБ');

      _toast('Отправка медиа...');
      const reader = new FileReader();
      reader.onload = async (ev) => {
        await _0xdb.from('direct_messages').insert({
          sender_id: _cu.id, receiver_id: _activeChatPeerId, encrypted_content: b58Encode(ev.target.result), msg_type: 'media'
        });
        _toast('Отправлено!');
      };
      reader.readAsDataURL(file);
    }

    function _openMsgActionsMenu(msg, isSelf) {
      _currentSelectedMsg = msg;
      const btnEdit = document.getElementById('btn-action-edit');
      btnEdit.style.display = (isSelf && msg.msg_type === 'text') ? 'flex' : 'none';
      _showModal('modal-msg-actions');
    }

    function _startEditMessage() {
      if (!_currentSelectedMsg) return;
      _hideModal('modal-msg-actions');
      _editingMsgId = _currentSelectedMsg.id;
      const inp = document.getElementById('chat-input-text');
      inp.value = b58Decode(_currentSelectedMsg.encrypted_content);
      document.getElementById('chat-edit-bar').style.display = 'flex';
      inp.focus();
    }

    function _cancelMessageEdit() {
      _editingMsgId = null;
      document.getElementById('chat-input-text').value = '';
      document.getElementById('chat-edit-bar').style.display = 'none';
    }

    async function _deleteCurrentMsg(mode) {
      if (!_currentSelectedMsg) return;
      const msgId = _currentSelectedMsg.id;
      _hideModal('modal-msg-actions');

      if (mode === 'all') {
        await _0xdb.from('direct_messages').delete().eq('id', msgId);
        _removeMessageFromDOM(msgId);
        _toast('Удалено у всех');
      } else {
        let curDeleted = _currentSelectedMsg.deleted_for || [];
        if (!curDeleted.includes(_cu.id)) curDeleted.push(_cu.id);
        await _0xdb.from('direct_messages').update({ deleted_for: curDeleted }).eq('id', msgId);
        _removeMessageFromDOM(msgId);
        _toast('Удалено у вас');
      }
      _currentSelectedMsg = null;
    }

    /* ПРОСМОТР ПРОФИЛЕЙ */
    async function _openUserProfile(userId) {
      _modalTargetUserId = userId;
      let p = _cachedProfiles[userId];

      if (p) {
        _renderUserProfileData(p);
        _showModal('modal-user-view');
      }

      const { data: freshP } = await _0xdb.from('profiles').select('*').eq('id', userId).maybeSingle();
      if (freshP) {
        _cachedProfiles[userId] = freshP;
        _renderUserProfileData(freshP);
        if (!p) _showModal('modal-user-view');
      }
    }

    function _renderUserProfileData(p) {
      document.getElementById('uv-banner').className = `banner-preview ${p.banner_url || 'banner-cyber'}`;
      const nameElem = document.getElementById('uv-username');
      nameElem.innerText = `@${p.username}`;
      _applyNitroTypography(nameElem, p.name_color, p.name_effect);

      document.getElementById('uv-bio').innerText = p.bio || 'Участник Nook';
      document.getElementById('uv-avatar-frame-box').className = p.avatar_frame || 'frame-none';

      const av = document.getElementById('uv-avatar');
      if (p.avatar_url) { av.src = p.avatar_url; av.style.display = 'block'; }
      else { av.src = ''; av.style.display = 'none'; }

      if (p.is_verified) document.getElementById('uv-badge-verified').style.display = 'block';
      else document.getElementById('uv-badge-verified').style.display = 'none';

      const musicBox = document.getElementById('uv-music-container');
      const musicSlot = document.getElementById('uv-music-player-slot');
      musicSlot.innerHTML = '';

      if (p.music_type === 'yandex' && p.music_url) {
        musicBox.style.display = 'block';
        let match = p.music_url.match(/track\/(\d+)/);
        if (match) {
          musicSlot.innerHTML = `<iframe frameborder="0" style="border:none;width:100%;height:100px;border-radius:12px;" src="https://music.yandex.ru/iframe/#track/${match[1]}"></iframe>`;
        } else {
          musicSlot.innerHTML = `<a href="${p.music_url}" target="_blank" style="color:#fc0; text-decoration:none; font-weight:800;">▶ Слушать трек</a>`;
        }
      } else if (p.music_type === 'spotify' && p.music_url) {
        musicBox.style.display = 'block';
        let trackId = p.music_url.split('track/')[1]?.split('?')[0] || '';
        musicSlot.innerHTML = `<iframe src="https://open.spotify.com/embed/track/${trackId}?theme=0" width="100%" height="80" frameBorder="0" style="border-radius:12px;"></iframe>`;
      } else {
        musicBox.style.display = 'none';
      }

      document.getElementById('uv-action-btns').style.display = (_cu && _cu.id === p.id) ? 'none' : 'flex';
    }

    function _openChatModalFromProfile() {
      if (!_modalTargetUserId) return;
      _hideModal('modal-user-view');
      _openDirectChat(_modalTargetUserId);
    }

    function _openUserHub() {
      if (!_cu) return _showModal('modal-auth');
      document.getElementById('edit-bio').value = _up?.bio || '';
      document.getElementById('profile-edit-preview').src = _up?.avatar_url || '';
      document.getElementById('edit-avatar-frame').value = _up?.avatar_frame || 'frame-none';
      document.getElementById('edit-banner-url').value = _up?.banner_url || 'banner-cyber';
      document.getElementById('edit-name-color').value = _up?.name_color || '#ffffff';
      document.getElementById('edit-name-effect').value = _up?.name_effect || 'fx-none';

      const isAdmin = _up?.is_admin === true;
      document.getElementById('card-theme-gold-hq').style.display = isAdmin ? 'flex' : 'none';
      document.getElementById('opt-admin-frame').style.display = isAdmin ? 'block' : 'none';
      document.getElementById('opt-admin-banner').style.display = isAdmin ? 'block' : 'none';
      document.getElementById('opt-admin-fx').style.display = isAdmin ? 'block' : 'none';

      // Подсветка текущей темы в плитках
      _setAppThemeCustom(_up?.app_theme || 'theme-oled');

      document.getElementById('edit-music-type').value = _up?.music_type || 'none';
      _onMusicTypeChange();
      document.getElementById('edit-music-url').value = _up?.music_url || '';

      _updateLivePreviewFrame();
      _tempAvatarBase64 = null;
      _showModal('modal-profile');
    }

    function _updateLivePreviewFrame() {
      const fr = document.getElementById('edit-avatar-frame').value;
      document.getElementById('profile-edit-frame-wrap').className = fr;
    }

    function _handleAvatarSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        _tempAvatarBase64 = ev.target.result;
        document.getElementById('profile-edit-preview').src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function _onMusicTypeChange() {
      const val = document.getElementById('edit-music-type').value;
      const inputSlot = document.getElementById('music-field-input');
      inputSlot.style.display = (val === 'yandex' || val === 'spotify') ? 'block' : 'none';
    }

    async function _saveProfile() {
      const bio = document.getElementById('edit-bio').value.trim();
      const frame = document.getElementById('edit-avatar-frame').value;
      const banner = document.getElementById('edit-banner-url').value;
      const color = document.getElementById('edit-name-color').value;
      const fx = document.getElementById('edit-name-effect').value;
      const mType = document.getElementById('edit-music-type').value;
      const mUrl = document.getElementById('edit-music-url').value.trim();

      const updateData = {
        bio: bio, app_theme: _selectedTheme, avatar_frame: frame, banner_url: banner,
        name_color: color, name_effect: fx, music_type: mType, music_url: mUrl
      };
      if (_tempAvatarBase64) updateData.avatar_url = _tempAvatarBase64;

      const { error } = await _0xdb.from('profiles').update(updateData).eq('id', _cu.id);
      if (error) return _toast('Ошибка: ' + error.message);

      _toast('Настройки сохранены!');
      _hideModal('modal-profile');
      _syncUser();
    }

    function _previewOwnProfile() {
      _hideModal('modal-profile');
      _openUserProfile(_cu.id);
    }

    async function _signOut() {
      localStorage.removeItem('nook_current_user_id');
      _hideModal('modal-profile');
      _resetUIForGuest();
      _toast('Вы вышли из системы');
    }

    /* ПОИСК */
    async function _loadAllUsersForSearch(query) {
      const cont = document.getElementById('search-results-container');
      let req = _0xdb.from('profiles').select('*').order('created_at', { ascending: false });
      if (query) req = req.ilike('username', `%${query}%`);
      const { data: users } = await req;
      cont.innerHTML = '';
      if (users) {
        users.forEach(u => {
          _cachedProfiles[u.id] = u;
          const item = document.createElement('div');
          item.className = 'search-result-item';
          item.onclick = () => _openUserProfile(u.id);
          item.innerHTML = `
            <div style="display:flex; align-items:center; gap:10px;">
              <div class="${u.avatar_frame || 'frame-none'}" style="width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;">
                ${u.avatar_url ? `<img src="${u.avatar_url}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;">` : `<div style="font-weight:900;">${u.username.charAt(0).toUpperCase()}</div>`}
              </div>
              <div>
                <div style="font-weight:900;">@${u.username}</div>
                <div style="font-size:11px; color:var(--muted);">${u.bio || 'Участник Nook'}</div>
              </div>
            </div>
            <span style="color:var(--muted); font-size:12px;">Профиль ➔</span>
          `;
          cont.appendChild(item);
        });
      }
    }

    function _handleSearchInput(e) { _loadAllUsersForSearch(e.target.value.trim().toLowerCase()); }

    /* ЛЕНТА */
    function _handlePostMediaSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        _postAttachedMedia = { url: ev.target.result, isVideo: file.type.startsWith('video') };
        _toast('Медиа прикреплено!');
      };
      reader.readAsDataURL(file);
    }

    async function _sendFeedPost() {
      if (!_cu) return _toast('Сначала войдите в систему');
      const text = document.getElementById('feed-post-text').value.trim();
      if (!text && !_postAttachedMedia) return _toast('Напишите пост или добавьте медиа');

      await _0xdb.from('posts').insert({
        author_id: _cu.id, content: text || 'Медиа-публикация', image_url: _postAttachedMedia ? _postAttachedMedia.url : null
      });

      document.getElementById('feed-post-text').value = '';
      _postAttachedMedia = null;
      _toast('Пост опубликован!');
      _loadFeedPosts();
    }

    async function _loadFeedPosts() {
      const { data: posts } = await _0xdb.from('posts').select('*, profiles(username, is_verified, avatar_url, avatar_frame, name_color, name_effect)').order('created_at', { ascending: false });
      const stream = document.getElementById('feed-stream');
      stream.innerHTML = '';
      if (!posts || posts.length === 0) {
        stream.innerHTML = '<p style="text-align:center; color:var(--muted); font-size:13px; margin-top:20px;">В ленте пока пусто</p>';
        return;
      }
      posts.forEach(p => {
        const card = document.createElement('div');
        card.className = 'liquid-post-card';
        card.innerHTML = `
          <div class="post-header post-author-row" onclick="_openUserProfile('${p.author_id}')">
            <div class="${p.profiles?.avatar_frame || 'frame-none'}" style="width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;">
              ${p.profiles?.avatar_url ? `<img class="post-avatar-img" src="${p.profiles.avatar_url}">` : `<div style="font-weight:900;">${p.profiles?.username?.charAt(0).toUpperCase()}</div>`}
            </div>
            <span>@${p.profiles?.username || 'user'}</span>
            ${p.profiles?.is_verified ? '<svg class="verified-icon" style="display:inline-block;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>' : ''}
          </div>
          <div class="post-body-text">${p.content}</div>
          ${p.image_url ? (p.image_url.startsWith('data:video') ? `<video class="post-attached-image" src="${p.image_url}" controls playsinline></video>` : `<img class="post-attached-image" src="${p.image_url}">`) : ''}
        `;
        stream.appendChild(card);
      });
    }

    async function _adminApplyUserBan(applyBan) {
      const u = document.getElementById('admin-ban-username').value.trim().toLowerCase();
      if (!u) return _toast('Введите юзернейм');
      const { data: user } = await _0xdb.from('profiles').select('id, is_admin').eq('username', u).maybeSingle();
      if (!user) return _toast('Пользователь не найден');
      if (user.is_admin) return _toast('Нельзя забанить админа!');

      if (!applyBan) {
        await _0xdb.from('profiles').update({ is_banned: false, banned_until: null }).eq('id', user.id);
        _toast(`@${u} разбанен!`);
        return;
      }

      const dur = document.getElementById('admin-ban-duration').value;
      let until = null;
      const now = new Date();
      if (dur === '1h') until = new Date(now.getTime() + 3600000);
      if (dur === '24h') until = new Date(now.getTime() + 86400000);

      await _0xdb.from('profiles').update({ is_banned: true, banned_until: until ? until.toISOString() : null }).eq('id', user.id);
      _toast(`@${u} забанен (${dur})!`);
    }

    (async () => {
      _syncUser();
    })();
  </script>
</body>
</html>
