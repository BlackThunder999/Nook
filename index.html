<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nook Nitro 8.0</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #030305;
      --liquid-card: rgba(18, 18, 26, 0.78);
      --liquid-specular: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.03) 45%, rgba(255, 255, 255, 0.08) 100%);
      --liquid-border: rgba(255, 255, 255, 0.16);
      --liquid-border-strong: rgba(255, 255, 255, 0.45);
      --text: #ffffff;
      --muted: #9ca3af;
      --danger: #ff453a;
      --success: #30d158;
      --accent: #0a84ff;
      --orb-1: #6366f1;
      --orb-2: #ec4899;
      --radius-2xl: 32px;
      --radius-xl: 22px;
      --radius-pill: 9999px;
    }

    /* ТЕМЫ ПРИЛОЖЕНИЯ */
    body.theme-cyber { --bg: #070312; --orb-1: #a855f7; --orb-2: #06b6d4; --liquid-card: rgba(24, 14, 45, 0.8); }
    body.theme-space { --bg: #020813; --orb-1: #3b82f6; --orb-2: #1d4ed8; --liquid-card: rgba(10, 25, 47, 0.8); }
    body.theme-crimson { --bg: #100204; --orb-1: #ef4444; --orb-2: #991b1b; --liquid-card: rgba(36, 10, 15, 0.8); }
    body.theme-gold-hq { --bg: #0b0902; --orb-1: #eab308; --orb-2: #ca8a04; --liquid-card: rgba(35, 29, 10, 0.8); }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      position: relative;
      transition: background 0.3s;
    }

    .ambient-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.32;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }
    .orb-1 { width: 400px; height: 400px; background: radial-gradient(circle, #ffffff, var(--orb-1)); top: -100px; left: 10%; }
    .orb-2 { width: 440px; height: 440px; background: radial-gradient(circle, var(--orb-2), #3b82f6); bottom: -120px; right: -60px; animation-duration: 22s; }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 30px) scale(1.1); }
      100% { transform: translate(-30px, 50px) scale(0.95); }
    }

    header {
      position: relative;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(12, 12, 16, 0.78);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-bottom: 1px solid var(--liquid-border);
    }
    .brand-wrap { display: flex; align-items: center; gap: 8px; }
    .brand-logo { font-weight: 900; font-size: 22px; letter-spacing: -0.05em; color: #fff; }
    .brand-tag { font-size: 9px; font-weight: 900; color: #000; background: #fff; padding: 2px 7px; border-radius: var(--radius-pill); }

    .user-pill-liquid {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
      background: var(--liquid-specular);
      backdrop-filter: blur(20px);
      padding: 5px 12px 5px 5px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--liquid-border);
      cursor: pointer;
    }
    .user-avatar-round {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #1e1e24;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
    }
    .verified-icon { width: 15px; height: 15px; fill: #fff; display: none; }

    main { flex: 1; overflow: hidden; position: relative; z-index: 10; }
    .view { display: none; height: 100%; }
    .view.active { display: flex; }

    /* ================= NITRO РАМКИ И ЭФФЕКТЫ ================= */
    .frame-none { border: 2px solid transparent; }
    .frame-neon { border: 3px solid #00f0ff; box-shadow: 0 0 14px #00f0ff; }
    .frame-cyber { border: 3px solid #f43f5e; box-shadow: 0 0 16px #f43f5e; border-style: dashed; }
    .frame-fire { border: 3px solid #ff7b00; box-shadow: 0 0 18px #ff3700; }
    .frame-ice { border: 3px solid #7dd3fc; box-shadow: 0 0 16px #38bdf8; }
    .frame-gold { border: 3px solid #fbbf24; box-shadow: 0 0 18px rgba(251, 191, 36, 0.8); }
    .frame-matrix-hq { border: 3px solid #10b981; box-shadow: 0 0 22px #059669; animation: matrixPulse 2s infinite alternate; }
    @keyframes matrixPulse { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(60deg); } }

    /* Эффекты никнейма */
    .fx-none {}
    .fx-neon { text-shadow: 0 0 8px currentColor, 0 0 16px currentColor; }
    .fx-glitch { animation: glitchText 1.5s infinite; }
    .fx-fire { text-shadow: 0 0 6px #ff7b00, 0 -2px 10px #ff3700; }
    .fx-rainbow { background: linear-gradient(90deg, #ff007a, #7928ca, #0070f3, #00dfd8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .fx-hologram-god { text-shadow: 0 0 10px #ffd700, 0 0 20px #10b981; font-weight: 900; }

    @keyframes glitchText { 0% { transform: skew(0deg); } 20% { transform: skew(-3deg); } 40% { transform: skew(3deg); } 100% { transform: skew(0deg); } }

    /* Постеры (10+ для админа) */
    .banner-preview {
      width: 100%; height: 110px; border-radius: var(--radius-xl) var(--radius-xl) 0 0; background-size: cover; background-position: center; position: relative;
    }
    .banner-cyber { background-image: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1518770660439-4636190af475?w=800&q=80'); }
    .banner-space { background-image: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=800&q=80'); }
    .banner-synth { background-image: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=800&q=80'); }
    .banner-sunset { background-image: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&q=80'); }
    
    /* 10 админских постеров */
    .b-hq-1 { background-image: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1534447677768-be436bb09401?w=800&q=80'); }
    .b-hq-2 { background-image: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=800&q=80'); }
    .b-hq-3 { background-image: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800&q=80'); }
    .b-hq-4 { background-image: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=800&q=80'); }
    .b-hq-5 { background-image: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=800&q=80'); }
    .b-hq-6 { background-image: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&q=80'); }
    .b-hq-7 { background-image: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=800&q=80'); }
    .b-hq-8 { background-image: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1508739773434-c26b3d09e071?w=800&q=80'); }
    .b-hq-9 { background-image: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?w=800&q=80'); }
    .b-hq-10 { background-image: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(18,18,26,1)), url('https://images.unsplash.com/photo-1516339901601-2e1b62dc0c45?w=800&q=80'); }

    /* ЭКРАНЫ */
    #view-chats { flex-direction: column; height: 100%; padding: 16px; overflow-y: auto; gap: 14px; }
    .chat-subtabs { display: flex; gap: 8px; background: rgba(255,255,255,0.06); padding: 4px; border-radius: var(--radius-pill); border: 1px solid var(--liquid-border); }
    .chat-subtab-btn { flex: 1; background: transparent; border: none; color: var(--muted); font-size: 13px; font-weight: 800; padding: 8px 12px; border-radius: var(--radius-pill); cursor: pointer; }
    .chat-subtab-btn.active { background: #fff; color: #000; }
    .chat-card-item { display: flex; align-items: center; justify-content: space-between; background: var(--liquid-card); border: 1px solid var(--liquid-border); padding: 14px 16px; border-radius: var(--radius-xl); cursor: pointer; }

    #view-feed { flex-direction: column; height: 100%; overflow-y: auto; padding: 16px; gap: 14px; }
    .liquid-composer-box { background: var(--liquid-card); backdrop-filter: blur(35px); border: 1px solid var(--liquid-border); border-radius: var(--radius-2xl); padding: 16px; }
    .composer-textarea { width: 100%; background: transparent; border: none; color: #fff; font-size: 15px; font-weight: 600; outline: none; resize: none; min-height: 54px; }
    .composer-bottom-bar { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--liquid-border); padding-top: 12px; }
    .btn-pick-liquid { display: flex; align-items: center; gap: 6px; color: #fff; font-size: 13px; font-weight: 800; cursor: pointer; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--liquid-border); padding: 8px 14px; border-radius: var(--radius-pill); }
    .btn-publish-liquid { background: #ffffff; color: #000000; border: none; padding: 10px 22px; border-radius: var(--radius-pill); font-weight: 900; font-size: 14px; cursor: pointer; }

    .liquid-post-card { background: var(--liquid-card); backdrop-filter: blur(35px); border: 1px solid var(--liquid-border); border-radius: var(--radius-2xl); padding: 18px; position: relative; }
    .post-num-badge { position: absolute; top: 16px; right: 16px; font-size: 11px; font-weight: 900; background: rgba(255, 255, 255, 0.1); padding: 3px 9px; border-radius: var(--radius-pill); border: 1px solid var(--liquid-border); }
    .post-author-row { display: flex; align-items: center; gap: 10px; font-size: 15px; margin-bottom: 10px; cursor: pointer; }
    .post-avatar-img { width: 34px; height: 34px; border-radius: 50%; background: #1c1c1e; object-fit: cover; }
    .post-body-text { font-size: 15px; font-weight: 500; color: #f3f4f6; line-height: 1.45; }
    .post-attached-image { margin-top: 12px; width: 100%; border-radius: var(--radius-xl); border: 1px solid var(--liquid-border); object-fit: cover; display: block; }
    .post-action-bar { display: flex; align-items: center; gap: 16px; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .post-btn-action { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 800; }
    .post-btn-action svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    #view-search { flex-direction: column; padding: 16px; overflow-y: auto; gap: 12px; }
    .search-input-box { background: var(--liquid-card); border: 1px solid var(--liquid-border); border-radius: var(--radius-xl); padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
    .search-input-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; font-weight: 700; outline: none; }
    .search-result-item { display: flex; align-items: center; justify-content: space-between; background: var(--liquid-card); border: 1px solid var(--liquid-border); padding: 12px 14px; border-radius: var(--radius-xl); cursor: pointer; }

    #view-admin { flex-direction: column; padding: 16px; overflow-y: auto; gap: 14px; }
    .admin-liquid-card { background: var(--liquid-card); border: 1px solid var(--liquid-border); border-radius: var(--radius-2xl); padding: 18px; }

    footer { position: relative; z-index: 50; display: flex; flex-direction: column; padding: 0 16px 12px; gap: 6px; }
    nav { display: flex; align-items: center; background: rgba(14, 14, 18, 0.85); border: 1px solid var(--liquid-border); backdrop-filter: blur(40px); border-radius: var(--radius-pill); padding: 10px 14px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7); }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 800; }
    .nav-btn.active { color: #fff; }
    .nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(30px); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
    .modal-liquid-shell { background: rgba(18, 18, 24, 0.94); border: 1px solid var(--liquid-border-strong); backdrop-filter: blur(45px); border-radius: var(--radius-2xl); width: 100%; max-width: 400px; overflow: hidden; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.9); }
    .modal-liquid-head { padding: 16px 20px; border-bottom: 1px solid var(--liquid-border); display: flex; align-items: center; justify-content: space-between; font-weight: 900; font-size: 16px; }
    .modal-liquid-body { padding: 20px; max-height: 74dvh; overflow-y: auto; font-size: 14px; }
    .liquid-input-field { margin-bottom: 12px; }
    .liquid-input-field label { display: block; font-size: 11px; font-weight: 800; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; }
    .liquid-input-field input, .liquid-input-field select { width: 100%; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--liquid-border); border-radius: var(--radius-xl); padding: 12px 14px; color: #fff; font-size: 14px; font-weight: 700; outline: none; }
    .liquid-input-field select option { background: #14141a; color: #fff; }
    .btn-liquid-main { width: 100%; background: #ffffff; color: #000000; border: none; padding: 13px; border-radius: var(--radius-pill); font-weight: 900; font-size: 14px; cursor: pointer; margin-top: 6px; }
    .btn-liquid-outline { background: transparent; border: 1px solid var(--liquid-border); color: #fff; }
    .btn-liquid-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; font-weight: 900; }

    .msg-bubble { max-width: 78%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-break: break-word; margin-bottom: 6px; }
    .msg-bubble.outgoing { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg-bubble.incoming { background: rgba(255,255,255,0.08); border: 1px solid var(--liquid-border); align-self: flex-start; border-bottom-left-radius: 4px; }

    #toast-box { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 6px; pointer-events: none; width: 90%; max-width: 320px; }
    .toast-liquid { background: rgba(24, 24, 30, 0.96); border: 1px solid var(--liquid-border-strong); backdrop-filter: blur(25px); padding: 12px 18px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 800; color: #fff; text-align: center; }
  </style>
</head>
<body class="theme-oled">

  <div class="ambient-glow">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div id="toast-box"></div>

  <header>
    <div class="brand-wrap">
      <div class="brand-logo">NOOK</div>
      <div class="brand-tag">NITRO 8.0</div>
    </div>
    <div class="user-pill-liquid" onclick="_openUserHub()">
      <div id="user-avatar-frame-wrap" style="position:relative; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;">
        <img id="user-avatar-img" class="user-avatar-round" style="display:none; width:26px; height:26px;" />
        <div id="user-avatar-placeholder" class="user-avatar-round" style="width:26px; height:26px;">N</div>
      </div>
      <span id="user-display">Вход</span>
      <svg id="badge-verified" class="verified-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    </div>
  </header>

  <main>
    <!-- ЭКРАН: ЧАТЫ -->
    <section id="view-chats" class="view active">
      <div class="chat-subtabs">
        <button id="subtab-direct" class="chat-subtab-btn active" onclick="_switchChatTab('direct')">Личные чаты</button>
        <button id="subtab-groups" class="chat-subtab-btn" onclick="_switchChatTab('groups')">Группы</button>
      </div>
      <div id="direct-chats-list" style="display:flex; flex-direction:column; gap:10px;"></div>
      <div id="groups-chats-list" style="display:none; flex-direction:column; gap:10px;">
        <div id="groups-container" style="display:flex; flex-direction:column; gap:10px;"></div>
      </div>
    </section>

    <!-- ЭКРАН: ЛЕНТА ПОСТОВ -->
    <section id="view-feed" class="view">
      <div class="liquid-composer-box">
        <textarea id="feed-post-text" class="composer-textarea" placeholder="Что нового?"></textarea>
        <div class="composer-bottom-bar">
          <label class="btn-pick-liquid">
            <span>Фото</span>
            <input type="file" id="feed-photo-picker" accept="image/*" style="display:none;" onchange="_handlePostPhotoSelect(event)">
          </label>
          <button class="btn-publish-liquid" id="btn-post-submit" onclick="_sendFeedPost()">Опубликовать</button>
        </div>
      </div>
      <div id="feed-stream" style="display:flex; flex-direction:column; gap:14px;"></div>
    </section>

    <!-- ЭКРАН: ПОИСК -->
    <section id="view-search" class="view">
      <div class="search-input-box">
        <input type="text" placeholder="Поиск по юзернейму..." oninput="_handleSearchInput(event)">
      </div>
      <div id="search-results-container" style="display:flex; flex-direction:column; gap:8px;"></div>
    </section>

    <!-- ЭКРАН: HQ АДМИН -->
    <section id="view-admin" class="view">
      <div class="admin-liquid-card">
        <h3>Модерация (Бан / Разбан)</h3>
        <div class="liquid-input-field">
          <label>Юзернейм нарушителя</label>
          <input type="text" id="admin-ban-username" placeholder="Логин">
        </div>
        <div class="liquid-input-field">
          <label>Срок</label>
          <select id="admin-ban-duration">
            <option value="perm">Навсегда</option>
            <option value="1h">1 час</option>
            <option value="24h">24 часа</option>
            <option value="7d">7 дней</option>
          </select>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn-liquid-main" style="background:var(--danger); color:#fff;" onclick="_adminApplyUserBan(true)">Забанить</button>
          <button class="btn-liquid-main btn-liquid-outline" onclick="_adminApplyUserBan(false)">Разбанить</button>
        </div>
      </div>

      <div class="admin-liquid-card">
        <h3>Верификация (Галочка)</h3>
        <div class="liquid-input-field">
          <input type="text" id="admin-verify-username" placeholder="Юзернейм">
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn-liquid-main" style="background:var(--success); color:#fff;" onclick="_adminToggleVerify(true)">Выдать</button>
          <button class="btn-liquid-main btn-liquid-outline" onclick="_adminToggleVerify(false)">Снять</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <nav>
      <button class="nav-btn active" onclick="_switchView('chats', event)">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Чаты</span>
      </button>
      <button class="nav-btn" onclick="_switchView('feed', event)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        <span>Лента</span>
      </button>
      <button class="nav-btn" onclick="_switchView('search', event)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Поиск</span>
      </button>
      <button id="nav-btn-admin" class="nav-btn" style="display:none;" onclick="_switchView('admin', event)">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>HQ</span>
      </button>
    </nav>
  </footer>

  <!-- МОДАЛКА: Просмотр профиля (с исправленным текстом ника!) -->
  <div id="modal-user-view" class="modal-backdrop">

  <script>
    const _0x1a = "https://tsoqstfbvjpusbhljtff.supabase.co";
    const _0x1b = "sb_publishable_eu27ROp3T7R3gEOeRezaFQ_RlmVnDSM";
    const _0xdb = supabase.createClient(_0x1a, _0x1b);

    let _cu = null, _up = null;
    let _activeChatPeerId = null;
    let _modalTargetUserId = null;
    let _postAttachedBase64 = null;
    let _tempAvatarBase64 = null;

    function _toast(m) {
      const b = document.getElementById('toast-box');
      const t = document.createElement('div');
      t.className = 'toast-liquid'; t.innerText = m;
      b.appendChild(t);
      setTimeout(() => { t.remove(); }, 3200);
    }

    async function _hashPassword(str) {
      const msgBuffer = new TextEncoder().encode(str + "_nook_salt_secure_2026");
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function b58Encode(str) { return btoa(encodeURIComponent(str)); }
    function b58Decode(str) { try { return decodeURIComponent(atob(str)); } catch(e) { return str; } }

    function _applyAppTheme(themeClass) {
      document.body.className = themeClass || 'theme-oled';
    }

    /* Чистое применение цвета и эффектов БЕЗ желтых плашек */
    function _applyNitroTypography(elem, color, effect) {
      if (!elem) return;
      elem.className = '';
      elem.style.background = 'none';
      elem.style.webkitBackgroundClip = 'unset';
      elem.style.webkitTextFillColor = 'unset';
      elem.style.color = color || '#ffffff';

      if (effect && effect !== 'fx-none') {
        elem.classList.add(effect);
      }
    }

    function _switchView(t, e) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('view-' + t).classList.add('active');
      if (e && e.currentTarget) e.currentTarget.classList.add('active');

      if (t === 'chats') _loadChats();
      if (t === 'feed') _loadFeedPosts();
      if (t === 'search') _loadAllUsersForSearch('');
    }

    function _showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function _hideModal(id) {
      document.getElementById(id).style.display = 'none';
      if (id === 'modal-user-view' || id === 'modal-profile') {
        const slot = document.getElementById('uv-music-player-slot');
        if (slot) slot.innerHTML = '';
        const box = document.getElementById('uv-music-container');
        if (box) box.style.display = 'none';
      }
      if (id === 'modal-direct-chat') _activeChatPeerId = null;
    }

    /* АВТОРИЗАЦИЯ */
    async function _authActionCustom(type) {
      const u = document.getElementById('auth-login').value.trim().toLowerCase();
      const p = document.getElementById('auth-pass').value.trim();
      if (!u || p.length < 4) return _toast('Юзернейм и пароль от 4 символов');

      const passHash = await _hashPassword(p);

      if (type === 'register') {
        const { data: exists } = await _0xdb.from('profiles').select('id').eq('username', u).maybeSingle();
        if (exists) return _toast('Юзернейм уже занят!');

        const isAdm = (u === 'nookoriginals');
        const { data: newUser, error } = await _0xdb.from('profiles').insert({
          username: u,
          password_hash: passHash,
          is_admin: isAdm,
          is_verified: isAdm
        }).select().single();

        if (error) return _toast('Ошибка: ' + error.message);
        localStorage.setItem('nook_current_user_id', newUser.id);
        _toast('Аккаунт создан!');
        _hideModal('modal-auth');
        _syncUser();
      } else {
        const { data: user } = await _0xdb.from('profiles').select('*').eq('username', u).maybeSingle();
        if (!user || user.password_hash !== passHash) {
          return _toast('Неверный логин или пароль');
        }

        if (user.is_banned) {
          if (user.banned_until && new Date() < new Date(user.banned_until)) {
            return _toast(`Аккаунт временно заблокирован до ${new Date(user.banned_until).toLocaleString()}`);
          } else if (!user.banned_until) {
            return _toast('Аккаунт заблокирован НАВСЕГДА');
          }
        }

        localStorage.setItem('nook_current_user_id', user.id);
        _toast('Вход выполнен!');
        _hideModal('modal-auth');
        _syncUser();
      }
    }

    async function _syncUser() {
      const savedUserId = localStorage.getItem('nook_current_user_id');
      if (!savedUserId) {
        _resetUIForGuest();
        return;
      }

      const { data: p } = await _0xdb.from('profiles').select('*').eq('id', savedUserId).maybeSingle();
      if (!p) {
        localStorage.removeItem('nook_current_user_id');
        _resetUIForGuest();
        return;
      }

      _cu = { id: p.id };
      _up = p;

      _applyAppTheme(p.app_theme || 'theme-oled');

      const disp = document.getElementById('user-display');
      disp.innerText = `@${p.username}`;
      _applyNitroTypography(disp, p.name_color, p.name_effect);

      const frameWrap = document.getElementById('user-avatar-frame-wrap');
      frameWrap.className = p.avatar_frame || 'frame-none';

      if (p.is_verified) document.getElementById('badge-verified').style.display = 'block';
      else document.getElementById('badge-verified').style.display = 'none';

      if (p.is_admin) document.getElementById('nav-btn-admin').style.display = 'flex';
      else document.getElementById('nav-btn-admin').style.display = 'none';

      if (p.avatar_url) {
        const img = document.getElementById('user-avatar-img');
        img.src = p.avatar_url; img.style.display = 'block';
        document.getElementById('user-avatar-placeholder').style.display = 'none';
      } else {
        document.getElementById('user-avatar-img').style.display = 'none';
        const pl = document.getElementById('user-avatar-placeholder');
        pl.style.display = 'flex'; pl.innerText = p.username.charAt(0).toUpperCase();
      }

      _loadChats();
    }

    /* Полный сброс всех украшений при выходе */
    function _resetUIForGuest() {
      _cu = null; _up = null;
      _applyAppTheme('theme-oled');
      document.getElementById('user-display').innerText = 'Вход';
      document.getElementById('user-display').className = '';
      document.getElementById('user-display').style.color = '#ffffff';
      document.getElementById('user-avatar-frame-wrap').className = 'frame-none';
      document.getElementById('badge-verified').style.display = 'none';
      document.getElementById('user-avatar-img').style.display = 'none';
      document.getElementById('user-avatar-placeholder').style.display = 'flex';
      document.getElementById('user-avatar-placeholder').innerText = 'N';
      document.getElementById('nav-btn-admin').style.display = 'none';
      document.getElementById('direct-chats-list').innerHTML = '';
    }

    function _openUserHub() {
      if (!_cu) return _showModal('modal-auth');
      document.getElementById('edit-bio').value = _up?.bio || '';
      document.getElementById('profile-edit-preview').src = _up?.avatar_url || '';
      document.getElementById('edit-app-theme').value = _up?.app_theme || 'theme-oled';
      document.getElementById('edit-avatar-frame').value = _up?.avatar_frame || 'frame-none';
      document.getElementById('edit-banner-url').value = _up?.banner_url || 'banner-cyber';
      document.getElementById('edit-name-color').value = _up?.name_color || '#ffffff';
      document.getElementById('edit-name-effect').value = _up?.name_effect || 'fx-none';

      const isAdmin = _up?.is_admin === true;
      document.getElementById('opt-admin-theme').style.display = isAdmin ? 'block' : 'none';
      document.getElementById('opt-admin-frame').style.display = isAdmin ? 'block' : 'none';
      document.getElementById('optgroup-admin-banners').style.display = isAdmin ? 'block' : 'none';
      document.getElementById('opt-admin-fx').style.display = isAdmin ? 'block' : 'none';

      document.getElementById('edit-music-type').value = _up?.music_type || 'none';
      _onMusicTypeChange();
      document.getElementById('edit-music-url').value = _up?.music_url || '';

      _updateLivePreviewFrame();
      _tempAvatarBase64 = null;
      _showModal('modal-profile');
    }

    function _updateLivePreviewFrame() {
      const fr = document.getElementById('edit-avatar-frame').value;
      document.getElementById('profile-edit-frame-wrap').className = fr;
    }

    function _handleAvatarSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        _tempAvatarBase64 = ev.target.result;
        document.getElementById('profile-edit-preview').src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function _onMusicTypeChange() {
      const val = document.getElementById('edit-music-type').value;
      const inputSlot = document.getElementById('music-field-input');
      inputSlot.style.display = (val === 'yandex' || val === 'spotify') ? 'block' : 'none';
    }

    async function _saveProfile() {
      const bio = document.getElementById('edit-bio').value.trim();
      const theme = document.getElementById('edit-app-theme').value;
      const frame = document.getElementById('edit-avatar-frame').value;
      const banner = document.getElementById('edit-banner-url').value;
      const color = document.getElementById('edit-name-color').value;
      const fx = document.getElementById('edit-name-effect').value;
      const mType = document.getElementById('edit-music-type').value;
      const mUrl = document.getElementById('edit-music-url').value.trim();

      const updateData = {
        bio: bio,
        app_theme: theme,
        avatar_frame: frame,
        banner_url: banner,
        name_color: color,
        name_effect: fx,
        music_type: mType,
        music_url: mUrl
      };
      if (_tempAvatarBase64) updateData.avatar_url = _tempAvatarBase64;

      const { error } = await _0xdb.from('profiles').update(updateData).eq('id', _cu.id);
      if (error) return _toast('Ошибка: ' + error.message);

      _toast('Профиль сохранен!');
      _hideModal('modal-profile');
      _syncUser();
    }

    function _previewOwnProfile() {
      _hideModal('modal-profile');
      _openUserProfile(_cu.id);
    }

    async function _signOut() {
      localStorage.removeItem('nook_current_user_id');
      _hideModal('modal-profile');
      _resetUIForGuest();
      _loadFeedPosts();
      _toast('Вы вышли из системы');
    }

    /* ОТКРЫТИЕ ЛЮБОГО ПРОФИЛЯ (РАБОТАЕТ ВСЕГДА) */
    async function _openUserProfile(userId) {
      _modalTargetUserId = userId;
      const { data: p } = await _0xdb.from('profiles').select('*').eq('id', userId).maybeSingle();
      if (!p) return _toast('Пользователь не найден');

      // 1. Постер
      const banner = document.getElementById('uv-banner');
      banner.className = `banner-preview ${p.banner_url || 'banner-cyber'}`;

      // 2. Четкий никнейм без заливок!
      const nameElem = document.getElementById('uv-username');
      nameElem.innerText = `@${p.username}`;
      _applyNitroTypography(nameElem, p.name_color, p.name_effect);

      document.getElementById('uv-bio').innerText = p.bio || 'Участник Nook';

      // 3. Рамка и Аватарка
      document.getElementById('uv-avatar-frame-box').className = p.avatar_frame || 'frame-none';
      const av = document.getElementById('uv-avatar');
      if (p.avatar_url) { av.src = p.avatar_url; av.style.display = 'block'; }
      else { av.src = ''; av.style.display = 'none'; }

      if (p.is_verified) document.getElementById('uv-badge-verified').style.display = 'block';
      else document.getElementById('uv-badge-verified').style.display = 'none';

      // 4. Музыка (Яндекс / Spotify)
      const musicBox = document.getElementById('uv-music-container');
      const musicSlot = document.getElementById('uv-music-player-slot');
      musicSlot.innerHTML = '';

      if (p.music_type === 'yandex' && p.music_url) {
        musicBox.style.display = 'block';
        let match = p.music_url.match(/track\/(\d+)/);
        if (match) {
          musicSlot.innerHTML = `<iframe frameborder="0" style="border:none;width:100%;height:100px;border-radius:12px;" src="https://music.yandex.ru/iframe/#track/${match[1]}"></iframe>`;
        } else {
          musicSlot.innerHTML = `<a href="${p.music_url}" target="_blank" style="color:#fc0; text-decoration:none; font-weight:800;">▶ Слушать в Яндекс Музыке</a>`;
        }
      } else if (p.music_type === 'spotify' && p.music_url) {
        musicBox.style.display = 'block';
        let trackId = p.music_url.split('track/')[1]?.split('?')[0] || '';
        musicSlot.innerHTML = `<iframe src="https://open.spotify.com/embed/track/${trackId}?theme=0" width="100%" height="80" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" style="border-radius:12px;"></iframe>`;
      } else {
        musicBox.style.display = 'none';
      }

      document.getElementById('uv-action-btns').style.display = (_cu && _cu.id === userId) ? 'none' : 'flex';
      _showModal('modal-user-view');
    }

    function _openChatModalFromProfile() {
      if (!_modalTargetUserId) return;
      _hideModal('modal-user-view');
      _openDirectChat(_modalTargetUserId);
    }

    /* СПИСОК ЧАТОВ С ПЕРЕХОДОМ В ПРОФИЛЬ */
    async function _loadChats() {
      if (!_cu) return;
      const directList = document.getElementById('direct-chats-list');
      const { data: users } = await _0xdb.from('profiles').select('*').neq('id', _cu.id).limit(30);
      directList.innerHTML = '';
      if (users) {
        users.forEach(u => {
          const item = document.createElement('div');
          item.className = 'chat-card-item';
          item.innerHTML = `
            <div style="display:flex; align-items:center; gap:12px; flex:1;" onclick="_openDirectChat('${u.id}')">
              <div class="${u.avatar_frame || 'frame-none'}" style="width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;">
                ${u.avatar_url ? `<img src="${u.avatar_url}" style="width:30px;height:30px;border-radius:50%;object-fit:cover;">` : `<div style="font-weight:900;">${u.username.charAt(0).toUpperCase()}</div>`}
              </div>
              <div>
                <div class="user-item-${u.id}" style="font-weight:900;">@${u.username}</div>
                <div style="font-size:12px; color:var(--muted);">${u.bio || 'Нажмите для беседы'}</div>
              </div>
            </div>
            <button onclick="event.stopPropagation(); _openUserProfile('${u.id}')" style="background:none; border:none; color:var(--accent); font-size:12px; font-weight:800; cursor:pointer; padding:6px 10px;">Профиль</button>
          `;
          directList.appendChild(item);
          _applyNitroTypography(item.querySelector(`.user-item-${u.id}`), u.name_color, u.name_effect);
        });
      }
    }

    async function _openDirectChat(peerId) {
      if (!_cu) return _toast('Войдите в аккаунт');
      _activeChatPeerId = peerId;
      const { data: peer } = await _0xdb.from('profiles').select('username').eq('id', peerId).maybeSingle();
      document.getElementById('chat-header-title').innerText = `@${peer?.username || 'user'}`;

      _showModal('modal-direct-chat');
      const cont = document.getElementById('chat-messages-container');
      cont.innerHTML = '<p style="color:var(--muted); font-size:12px; text-align:center;">Загрузка...</p>';

      const { data: msgs } = await _0xdb.from('direct_messages')
        .select('*')
        .or(`and(sender_id.eq.${_cu.id},receiver_id.eq.${peerId}),and(sender_id.eq.${peerId},receiver_id.eq.${_cu.id})`)
        .order('created_at', { ascending: true });

      cont.innerHTML = '';
      if (msgs) {
        msgs.forEach(m => {
          const bubble = document.createElement('div');
          bubble.className = `msg-bubble ${m.sender_id === _cu.id ? 'outgoing' : 'incoming'}`;
          bubble.innerText = b58Decode(m.encrypted_content);
          cont.appendChild(bubble);
        });
      }
      cont.scrollTop = cont.scrollHeight;
    }

    async function _sendDirectMessage() {
      const inp = document.getElementById('chat-input-text');
      const text = inp.value.trim();
      if (!text || !_activeChatPeerId || !_cu) return;

      const enc = b58Encode(text);
      inp.value = '';
      await _0xdb.from('direct_messages').insert({
        sender_id: _cu.id,
        receiver_id: _activeChatPeerId,
        encrypted_content: enc
      });
      _openDirectChat(_activeChatPeerId);
    }

    /* ПОИСК */
    async function _loadAllUsersForSearch(query) {
      const cont = document.getElementById('search-results-container');
      let req = _0xdb.from('profiles').select('*').order('created_at', { ascending: false });
      if (query) req = req.ilike('username', `%${query}%`);
      const { data: users } = await req;
      cont.innerHTML = '';
      if (users) {
        users.forEach(u => {
          const item = document.createElement('div');
          item.className = 'search-result-item';
          item.onclick = () => _openUserProfile(u.id);
          item.innerHTML = `
            <div style="display:flex; align-items:center; gap:10px;">
              <div class="${u.avatar_frame || 'frame-none'}" style="width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;">
                ${u.avatar_url ? `<img src="${u.avatar_url}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;">` : `<div style="font-weight:900;">${u.username.charAt(0).toUpperCase()}</div>`}
              </div>
              <div>
                <div class="search-name-${u.id}" style="font-weight:900;">@${u.username}</div>
                <div style="font-size:11px; color:var(--muted);">${u.bio || 'Участник Nook'}</div>
              </div>
            </div>
            <span style="color:var(--muted); font-size:12px;">Профиль ➔</span>
          `;
          cont.appendChild(item);
          _applyNitroTypography(item.querySelector(`.search-name-${u.id}`), u.name_color, u.name_effect);
        });
      }
    }

    function _handleSearchInput(e) {
      _loadAllUsersForSearch(e.target.value.trim().toLowerCase());
    }

    /* ЛЕНТА ПОСТОВ */
    function _handlePostPhotoSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => { _postAttachedBase64 = ev.target.result; _toast('Фото прикреплено'); };
      reader.readAsDataURL(file);
    }

    async function _sendFeedPost() {
      if (!_cu) return _toast('Сначала войдите в систему');
      const text = document.getElementById('feed-post-text').value.trim();
      if (!text && !_postAttachedBase64) return _toast('Напишите пост или добавьте фото');

      await _0xdb.from('posts').insert({
        author_id: _cu.id,
        content: text || 'Фотография',
        image_url: _postAttachedBase64 || null
      });

      document.getElementById('feed-post-text').value = '';
      _postAttachedBase64 = null;
      _toast('Пост опубликован!');
      _loadFeedPosts();
    }

    async function _loadFeedPosts() {
      const { data: posts } = await _0xdb.from('posts').select('*, profiles(username, is_verified, avatar_url, avatar_frame, name_color, name_effect)').order('created_at', { ascending: false });
      const stream = document.getElementById('feed-stream');
      stream.innerHTML = '';
      if (!posts || posts.length === 0) {
        stream.innerHTML = '<p style="text-align:center; color:var(--muted); font-size:13px; margin-top:20px;">В ленте пока пусто</p>';
        return;
      }
      posts.forEach(p => {
        const card = document.createElement('div');
        card.className = 'liquid-post-card';
        card.innerHTML = `
          <div class="post-header post-author-row" onclick="_openUserProfile('${p.author_id}')">
            <div class="${p.profiles?.avatar_frame || 'frame-none'}" style="width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;">
              ${p.profiles?.avatar_url ? `<img class="post-avatar-img" src="${p.profiles.avatar_url}">` : `<div style="font-weight:900;">${p.profiles?.username?.charAt(0).toUpperCase()}</div>`}
            </div>
            <span class="post-user-${p.id}">@${p.profiles?.username || 'user'}</span>
            ${p.profiles?.is_verified ? '<svg class="verified-icon" style="display:inline-block;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>' : ''}
          </div>
          <div class="post-body-text">${p.content}</div>
          ${p.image_url ? `<img class="post-attached-image" src="${p.image_url}">` : ''}
        `;
        stream.appendChild(card);
        _applyNitroTypography(card.querySelector(`.post-user-${p.id}`), p.profiles?.name_color, p.profiles?.name_effect);
      });
    }

    /* АДМИНКА */
    async function _adminApplyUserBan(applyBan) {
      const u = document.getElementById('admin-ban-username').value.trim().toLowerCase();
      if (!u) return _toast('Введите юзернейм');
      const { data: user } = await _0xdb.from('profiles').select('id, is_admin').eq('username', u).maybeSingle();
      if (!user) return _toast('Пользователь не найден');
      if (user.is_admin) return _toast('Нельзя забанить админа!');

      if (!applyBan) {
        await _0xdb.from('profiles').update({ is_banned: false, banned_until: null }).eq('id', user.id);
        _toast(`@${u} разбанен!`);
        return;
      }

      const dur = document.getElementById('admin-ban-duration').value;
      let until = null;
      const now = new Date();
      if (dur === '1h') until = new Date(now.getTime() + 3600000);
      if (dur === '24h') until = new Date(now.getTime() + 86400000);
      if (dur === '7d') until = new Date(now.getTime() + 604800000);

      await _0xdb.from('profiles').update({ is_banned: true, banned_until: until ? until.toISOString() : null }).eq('id', user.id);
      _toast(`@${u} забанен (${dur})!`);
    }

    async function _adminToggleVerify(status) {
      const u = document.getElementById('admin-verify-username').value.trim().toLowerCase();
      await _0xdb.from('profiles').update({ is_verified: status }).eq('username', u);
      _toast(`Статус @${u} изменен`);
      _syncUser();
    }

    // Старт
    (async () => {
      _syncUser();
    })();
  </script>
</body>
</html>
