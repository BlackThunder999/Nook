<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nook</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: rgba(22, 27, 36, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #8e95a5;
      --accent: #2481cc;
      --accent-glow: rgba(36, 129, 204, 0.4);
      --bubble-out: #2b5278;
      --bubble-in: #182533;
      --danger: #ff453a;
      --success: #30d158;
      --check-blue: #40b2ff;
      --ios-radius: 20px;
      --spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.theme-oled {
      --bg: #000000;
      --card-bg: rgba(16, 16, 20, 0.9);
      --card-border: rgba(255, 255, 255, 0.1);
      --bubble-out: #1f4068;
      --bubble-in: #12161f;
    }
    body.theme-cyber {
      --bg: #0d0221;
      --card-bg: rgba(25, 10, 50, 0.85);
      --card-border: rgba(0, 240, 255, 0.25);
      --accent: #00f0ff;
      --bubble-out: #380b61;
      --bubble-in: #1a082e;
    }
    body.theme-space {
      --bg: #030a1a;
      --card-bg: rgba(10, 24, 52, 0.85);
      --card-border: rgba(56, 189, 248, 0.2);
      --accent: #38bdf8;
      --bubble-out: #1e3a8a;
      --bubble-in: #0f172a;
    }
    body.theme-gold-hq {
      --bg: #120e03;
      --card-bg: rgba(38, 30, 10, 0.9);
      --card-border: rgba(255, 215, 0, 0.3);
      --accent: #ffd700;
      --bubble-out: #523e02;
      --bubble-in: #241c03;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    /* ШАПКА В СТИЛЕ TELEGRAM */
    header {
      position: relative;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: rgba(16, 20, 28, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--card-border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-icon {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s var(--spring);
    }
    .btn-icon:active { transform: scale(0.9); }
    .btn-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 4px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 9999px;
      cursor: pointer;
      transition: transform 0.2s var(--spring);
    }
    .user-pill:active { transform: scale(0.94); }
    .user-pill-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #1c222d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
    }
    .user-pill-name {
      font-size: 13px;
      font-weight: 700;
    }

    /* ОСНОВНАЯ ОБЛАСТЬ ЭКРАНОВ */
    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .tab-view {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 14px;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .tab-view.active {
      display: flex;
      animation: tabFadeIn 0.25s var(--spring);
    }
    @keyframes tabFadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    /* СТИЛИ ЧАТОВ */
    .chat-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--ios-radius);
      cursor: pointer;
      transition: transform 0.2s var(--spring), background 0.2s ease;
    }
    .chat-item:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.06);
    }
    .chat-avatar-wrap {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .chat-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #1b2230;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
    }
    .chat-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .chat-name {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-preview {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ПОСТЫ / ЛЕНТА */
    .post-composer {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--ios-radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .post-textarea {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
      resize: none;
      min-height: 52px;
      user-select: text;
    }
    .post-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--card-border);
      padding-top: 10px;
    }
    .btn-pill {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s var(--spring);
    }
    .btn-pill:active { transform: scale(0.92); }
    .btn-media-attach {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      cursor: pointer;
    }

    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--ios-radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .post-media-content {
      width: 100%;
      border-radius: 14px;
      max-height: 380px;
      object-fit: cover;
    }

    /* НИЖНИЙ НАВИГАЦИОННЫЙ БАР TELEGRAM: ВСЕГО 2 КНОПКИ */
    footer {
      position: relative;
      z-index: 50;
      padding: 8px 16px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: rgba(14, 18, 26, 0.9);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-top: 1px solid var(--card-border);
    }
    .tab-bar-telegram {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 9999px;
      padding: 6px 12px;
    }
    .tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 9999px;
      transition: all 0.25s var(--spring);
    }
    .tab-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
    }
    .tab-btn.active {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    /* ДИАЛОГ ЧАТА (TELEGRAM-СТИЛЬ БЕЗ БАГОВ) */
    .chat-screen-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 150;
      background: var(--bg);
      flex-direction: column;
    }
    .chat-screen-backdrop.active {
      display: flex;
      animation: slideChatIn 0.3s var(--spring);
    }
    @keyframes slideChatIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .chat-screen-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: rgba(16, 20, 28, 0.9);
      backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--card-border);
    }
    .chat-messages-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-wrap {
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    .msg-bubble {
      max-width: 76%;
      padding: 8px 12px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 4px;
      user-select: text;
    }
    .msg-bubble.outgoing {
      background: var(--bubble-out) !important;
      color: #ffffff !important;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg-bubble.incoming {
      background: var(--bubble-in) !important;
      color: #ffffff !important;
      border: 1px solid var(--card-border);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .msg-thumb-wrap {
      width: 100%;
      max-width: 240px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .msg-thumb-wrap img, .msg-thumb-wrap video {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      display: block;
      border-radius: 12px;
    }
    .msg-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      font-size: 10px;
      opacity: 0.7;
      margin-top: 2px;
    }
    .msg-meta svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    /* ПАНЕЛЬ ПРИКРЕПЛЕНИЯ МЕДИА В ЧАТЕ */
    .media-preview-box {
      display: none;
      padding: 8px 14px;
      background: rgba(22, 28, 38, 0.95);
      border-top: 1px solid var(--card-border);
      align-items: center;
      gap: 10px;
    }
    .media-preview-thumb {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--card-border);
    }

    .chat-screen-input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: rgba(16, 20, 28, 0.95);
      border-top: 1px solid var(--card-border);
    }
    .chat-text-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--card-border);
      border-radius: 9999px;
      padding: 10px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
      user-select: text;
    }

    /* МОДАЛЬНЫЕ ОКНА И КАРТОЧКА ПРОФИЛЯ */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(25px);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-sheet {
      background: rgba(20, 25, 36, 0.96);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      width: 100%;
      max-width: 400px;
      max-height: 85dvh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: modalPop 0.28s var(--spring);
    }
    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ВИНИЛОВЫЙ ДИСК С ВОЛНАМИ */
    .vinyl-box {
      background: rgba(10, 14, 22, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }
    .vinyl-row {
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
    }
    .vinyl-sleeve {
      width: 58px;
      height: 58px;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      z-index: 2;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .vinyl-disc {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle, #2d2d38 12%, #111115 13%, #1e1e24 28%, #0d0d10 45%, #22222a 62%, #0a0a0d 100%);
      border: 2px solid rgba(255, 255, 255, 0.15);
      position: absolute;
      left: 24px;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: left 0.3s var(--spring);
    }
    .vinyl-disc::after {
      content: '';
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
    }
    .vinyl-box.playing .vinyl-disc {
      left: 46px;
      animation: spinVinyl 3.5s linear infinite;
    }
    @keyframes spinVinyl { 100% { transform: rotate(360deg); } }

    .waves-row {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 22px;
    }
    .wave-col {
      width: 4px;
      height: 5px;
      border-radius: 4px;
      background: var(--accent);
      transition: height 0.2s ease;
    }
    .vinyl-box.playing .wave-col:nth-child(1) { animation: waveHop 0.7s infinite alternate 0.1s; }
    .vinyl-box.playing .wave-col:nth-child(2) { animation: waveHop 0.5s infinite alternate 0.3s; }
    .vinyl-box.playing .wave-col:nth-child(3) { animation: waveHop 0.8s infinite alternate 0.2s; }
    .vinyl-box.playing .wave-col:nth-child(4) { animation: waveHop 0.6s infinite alternate 0.4s; }
    .vinyl-box.playing .wave-col:nth-child(5) { animation: waveHop 0.9s infinite alternate 0.15s; }
    @keyframes waveHop { 0% { height: 5px; } 100% { height: 20px; } }

    /* ЭКРАН БЛОКИРОВКИ */
    #screen-banned {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 99999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .ban-icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 69, 58, 0.15);
      border: 1px solid var(--danger);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .ban-icon-wrap svg { width: 42px; height: 42px; stroke: var(--danger); fill: none; stroke-width: 2.2; }

    #toast-wrap {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .toast-msg {
      background: rgba(20, 24, 32, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 9999px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body class="theme-oled" onclick="_unlockAudio()">

  <!-- ЭКРАН БЛОКИРОВКИ -->
  <div id="screen-banned">
    <div class="ban-icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
    </div>
    <h2 style="font-size:22px; font-weight:800; margin-bottom:8px;">Доступ ограничен</h2>
    <p id="ban-reason-text" style="color:var(--muted); font-size:14px; margin-bottom:14px;">Нарушение правил сообщества</p>
    <div style="background:rgba(255,255,255,0.06); border:1px solid var(--card-border); border-radius:16px; padding:12px; width:100%; max-width:320px; font-size:13px; margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <span style="color:var(--muted);">Срок:</span>
        <span id="ban-date-text" style="font-weight:700;">Навсегда</span>
      </div>
      <div style="display:flex; justify-content:space-between;">
        <span style="color:var(--muted);">Аккаунт:</span>
        <span id="ban-user-text" style="font-weight:700;">@user</span>
      </div>
    </div>
    <button class="btn-pill" onclick="_logout()">Выйти</button>
  </div>

  <div id="toast-wrap"></div>

  <!-- ШАПКА -->
  <header>
    <div class="brand">
      <span class="brand-title">NOOK</span>
    </div>
    <div class="header-actions">
      <button class="btn-icon" onclick="_openSearchModal()" title="Поиск пользователей">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <div class="user-pill" onclick="_openProfileHub()">
        <div id="pill-avatar" class="user-pill-avatar">N</div>
        <span id="pill-name" class="user-pill-name">Вход</span>
      </div>
    </div>
  </header>

  <!-- ОСНОВНЫЕ ВКЛАДКИ -->
  <main>
    <!-- ВКЛАДКА 1: ЧАТЫ -->
    <section id="tab-chats" class="tab-view active">
      <div id="chats-list-container" style="display:flex; flex-direction:column; gap:8px;"></div>
    </section>

    <!-- ВКЛАДКА 2: ПОСТЫ (ЛЕНТА) -->
    <section id="tab-posts" class="tab-view">
      <div class="post-composer">
        <textarea id="composer-text" class="post-textarea" placeholder="Что у вас нового?"></textarea>
        <div class="post-bar">
          <label class="btn-media-attach">
            <svg style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            <span>Медиа</span>
            <input type="file" id="composer-file" accept="image/*,video/*" style="display:none;" onchange="_onSelectPostMedia(event)">
          </label>
          <button class="btn-pill" onclick="_publishPost()">Опубликовать</button>
        </div>
      </div>
      <div id="posts-stream" style="display:flex; flex-direction:column; gap:12px;"></div>
    </section>
  </main>

  <!-- НАВИГАЦИОННЫЙ БАР: ВСЕГО 2 КНОПКИ -->
  <footer>
    <div class="tab-bar-telegram">
      <button id="btn-tab-chats" class="tab-btn active" onclick="_switchTab('chats')">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Чаты</span>
      </button>
      <button id="btn-tab-posts" class="tab-btn" onclick="_switchTab('posts')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        <span>Посты</span>
      </button>
    </div>
  </footer>

  <!-- ОКНО ЧАТА В СТИЛЕ TELEGRAM -->
  <div id="screen-chat" class="chat-screen-backdrop">

  <div id="modal-auth" class="modal-overlay">

      <button class="btn-pill" style="background:transparent; border:1px solid var(--card-border); color:#fff; padding:10px;" onclick="_handleAuth('register')">Создать аккаунт</button>
    </div>
  </div>

  <script>
    const _dbUrl = "https://tsoqstfbvjpusbhljtff.supabase.co";
    const _dbKey = "sb_publishable_eu27ROp3T7R3gEOeRezaFQ_RlmVnDSM";
    const _db = supabase.createClient(_dbUrl, _dbKey);

    /* АВТОНОМНЫЙ ВИНИЛ-СИНТЕЗАТОР (WEB AUDIO API) */
    let _audioCtx = null;
    let _synthTimer = null;
    let _isPlayingVinyl = false;

    const NOOK_TRACKS = {
      cyber_drift: {
        title: "Cyber Drift 2026",
        genre: "Synth Phonk",
        cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=300&q=80",
        bpm: 125,
        pattern: [65.41, 130.81, 98.00, 116.54]
      },
      neon_horizon: {
        title: "Neon Horizon",
        genre: "Future Bass",
        cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300&q=80",
        bpm: 140,
        pattern: [174.61, 220.00, 261.63, 329.63]
      }
    };

    let _currentUser = null;
    let _activeChatPeerId = null;
    let _inspectedUser = null;
    let _postMediaFile = null;
    let _chatMediaAttachment = null;
    let _profilesCache = {};

    function _toast(text) {
      const w = document.getElementById('toast-wrap');
      const el = document.createElement('div');
      el.className = 'toast-msg';
      el.innerText = text;
      w.appendChild(el);
      setTimeout(() => el.remove(), 2800);
    }

    function _unlockAudio() {
      if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (_audioCtx.state === 'suspended') _audioCtx.resume();
    }

    async function _hashPass(s) {
      const buf = new TextEncoder().encode(s + "_nook_salt_secure_2026");
      const h = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function b64e(str) { return btoa(encodeURIComponent(str)); }
    function b64d(str) { try { return decodeURIComponent(atob(str)); } catch(e) { return str; } }

    /* БЕЗОПАСНАЯ ПРОВЕРКА СВЯЗИ (БЕЗ ЗАВИСАНИЙ ИЗ-ЗА ГЛУШИЛОК) */
    async function _safeNetworkPing() {
      const c = new AbortController();
      const t = setTimeout(() => c.abort(), 2000);
      try {
        await fetch('https://ipapi.co/json/', { signal: c.signal });
        clearTimeout(t);
      } catch (e) {
        clearTimeout(t);
      }
    }

    /* ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК (ЧАТЫ / ПОСТЫ) */
    function _switchTab(tab) {
      document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('btn-tab-' + tab).classList.add('active');

      if (tab === 'chats') _loadChatsList();
      if (tab === 'posts') _loadFeedStream();
    }

    function _showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function _hideModal(id) {
      document.getElementById(id).style.display = 'none';
      if (id === 'modal-view-user') _stopVinyl();
    }

    /* АВТОРИЗАЦИЯ */
    async function _handleAuth(action) {
      const u = document.getElementById('auth-u').value.trim().toLowerCase();
      const p = document.getElementById('auth-p').value.trim();
      if (!u || p.length < 4) return _toast('Логин и пароль от 4 символов');

      const passHash = await _hashPass(p);

      if (action === 'register') {
        const { data: ex } = await _db.from('profiles').select('id').eq('username', u).maybeSingle();
        if (ex) return _toast('Юзернейм уже занят!');

        const isAdm = (u === 'nookoriginals');
        const { data: nu, error } = await _db.from('profiles').insert({
          username: u,
          password_hash: passHash,
          is_admin: isAdm,
          is_verified: isAdm,
          app_theme: 'theme-oled',
          music_type: 'vinyl',
          vinyl_track: 'cyber_drift'
        }).select().single();

        if (error) return _toast('Ошибка: ' + error.message);
        localStorage.setItem('nook_uid', nu.id);
        _hideModal('modal-auth');
        _syncApp();
      } else {
        const { data: user } = await _db.from('profiles').select('*').eq('username', u).maybeSingle();
        if (!user || user.password_hash !== passHash) return _toast('Неверные данные для входа');

        if (user.is_banned) {
          _showBanScreen(user);
          return;
        }

        localStorage.setItem('nook_uid', user.id);
        _hideModal('modal-auth');
        _syncApp();
      }
    }

    function _showBanScreen(user) {
      document.getElementById('ban-reason-text').innerText = user.ban_reason || 'Нарушение правил';
      document.getElementById('ban-date-text').innerText = user.banned_until ? new Date(user.banned_until).toLocaleString() : 'НАВСЕГДА';
      document.getElementById('ban-user-text').innerText = `@${user.username}`;
      document.getElementById('screen-banned').style.display = 'flex';
    }

    function _logout() {
      localStorage.removeItem('nook_uid');
      location.reload();
    }

    /* ЗАГРУЗКА ПРИЛОЖЕНИЯ */
    async function _syncApp() {
      const uid = localStorage.getItem('nook_uid');
      if (!uid) {
        _showModal('modal-auth');
        return;
      }

      const { data: profile } = await _db.from('profiles').select('*').eq('id', uid).maybeSingle();
      if (!profile) {
        localStorage.removeItem('nook_uid');
        _showModal('modal-auth');
        return;
      }

      if (profile.is_banned) {
        _showBanScreen(profile);
        return;
      }

      _currentUser = profile;
      _profilesCache[profile.id] = profile;

      _applyTheme(profile.app_theme || 'theme-oled');
      document.getElementById('pill-name').innerText = `@${profile.username}`;
      if (profile.avatar_url) {
        document.getElementById('pill-avatar').innerHTML = `<img src="${profile.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        document.getElementById('pill-avatar').innerText = profile.username.charAt(0).toUpperCase();
      }

      if (profile.is_admin) {
        document.getElementById('opt-admin-theme').style.display = 'block';
      }

      _initRealtime();
      _loadChatsList();
    }

    function _applyTheme(t) {
      document.body.className = t;
      localStorage.setItem('nook_theme', t);
    }

    /* РЕАЛТАЙМ ЧАТА */
    function _initRealtime() {
      _db.channel('nook_chat_realtime')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'direct_messages' }, (payload) => {
          const m = payload.new;
          if (_activeChatPeerId && ((m.sender_id === _activeChatPeerId && m.receiver_id === _currentUser?.id) ||
              (m.sender_id === _currentUser?.id && m.receiver_id === _activeChatPeerId))) {
            _appendMessage(m);
            if (m.receiver_id === _currentUser?.id) {
              _db.from('direct_messages').update({ is_read: true }).eq('id', m.id);
            }
          } else if (m.receiver_id === _currentUser?.id) {
            _toast('Новое сообщение!');
          }
        })
        .subscribe();
    }

    /* СПИСОК ЧАТОВ */
    async function _loadChatsList() {
      if (!_currentUser) return;
      const box = document.getElementById('chats-list-container');
      const { data: users } = await _db.from('profiles').select('*').neq('id', _currentUser.id).limit(40);
      box.innerHTML = '';
      if (!users) return;

      users.forEach(u => {
        _profilesCache[u.id] = u;
        const item = document.createElement('div');
        item.className = 'chat-item';
        item.onclick = () => _openChatWith(u.id);
        item.innerHTML = `
          <div class="chat-avatar-wrap">
            ${u.avatar_url ? `<img class="chat-avatar-img" src="${u.avatar_url}">` : `<div class="chat-avatar-img">${u.username.charAt(0).toUpperCase()}</div>`}
          </div>
          <div class="chat-info">
            <span class="chat-name">@${u.username}</span>
            <span class="chat-preview">${u.bio || 'Нажмите, чтобы начать диалог'}</span>
          </div>
        `;
        box.appendChild(item);
      });
    }

    /* ОТКРЫТИЕ ЭКРАНА ЧАТА */
    async function _openChatWith(peerId) {
      _activeChatPeerId = peerId;
      const peer = _profilesCache[peerId] || (await _db.from('profiles').select('*').eq('id', peerId).maybeSingle()).data;
      document.getElementById('chat-peer-title').innerText = `@${peer?.username || 'user'}`;

      const screen = document.getElementById('screen-chat');
      screen.classList.add('active');

      const cont = document.getElementById('chat-messages-box');
      cont.innerHTML = '<p style="text-align:center; color:var(--muted); font-size:12px;">Загрузка истории...</p>';

      await _db.from('direct_messages')
        .update({ is_read: true })
        .eq('sender_id', peerId)
        .eq('receiver_id', _currentUser.id)
        .eq('is_read', false);

      const { data: msgs } = await _db.from('direct_messages')
        .select('*')
        .or(`and(sender_id.eq.${_currentUser.id},receiver_id.eq.${peerId}),and(sender_id.eq.${peerId},receiver_id.eq.${_currentUser.id})`)
        .order('created_at', { ascending: true });

      cont.innerHTML = '';
      if (msgs) msgs.forEach(m => _appendMessage(m));
      cont.scrollTop = cont.scrollHeight;
    }

    function _closeChatScreen() {
      document.getElementById('screen-chat').classList.remove('active');
      _activeChatPeerId = null;
      _clearChatAttachment();
    }

    /* ПРИКРЕПЛЕНИЕ МЕДИА В ЧАТЕ */
    function _onChatMediaPicked(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 15 * 1024 * 1024) return _toast('Максимальный размер: 15 МБ');

      const r = new FileReader();
      r.onload = (ev) => {
        _chatMediaAttachment = ev.target.result;
        document.getElementById('chat-preview-img').src = ev.target.result;
        document.getElementById('chat-preview-panel').style.display = 'flex';
        document.getElementById('chat-input').focus();
      };
      r.readAsDataURL(file);
    }

    function _clearChatAttachment() {
      _chatMediaAttachment = null;
      document.getElementById('chat-file-input').value = '';
      document.getElementById('chat-preview-panel').style.display = 'none';
    }

    /* ОТПРАВКА СООБЩЕНИЯ (ТЕКСТ + МЕДИА) */
    async function _sendChatMessage() {
      const inp = document.getElementById('chat-input');
      const text = inp.value.trim();
      if (!text && !_chatMediaAttachment) return;
      if (!_activeChatPeerId || !_currentUser) return;

      let payload = text;
      let mType = 'text';

      if (_chatMediaAttachment) {
        payload = JSON.stringify({
          media: _chatMediaAttachment,
          caption: text || ''
        });
        mType = 'media';
      }

      inp.value = '';
      _clearChatAttachment();

      await _db.from('direct_messages').insert({
        sender_id: _currentUser.id,
        receiver_id: _activeChatPeerId,
        encrypted_content: b64e(payload),
        msg_type: mType
      });
    }

    /* ОТРИСОВКА СООБЩЕНИЯ */
    function _appendMessage(m) {
      const cont = document.getElementById('chat-messages-box');
      const isSelf = m.sender_id === _currentUser.id;
      const raw = b64d(m.encrypted_content);

      const wrap = document.createElement('div');
      wrap.className = 'msg-wrap';
      wrap.style.alignItems = isSelf ? 'flex-end' : 'flex-start';

      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${isSelf ? 'outgoing' : 'incoming'}`;

      let body = '';
      if (m.msg_type === 'media') {
        try {
          const parsed = JSON.parse(raw);
          const isVideo = parsed.media.startsWith('data:video');
          body += `
            <div class="msg-thumb-wrap">
              ${isVideo ? `<video src="${parsed.media}" controls playsinline></video>` : `<img src="${parsed.media}">`}
            </div>
          `;
          if (parsed.caption) body += `<div>${_escape(parsed.caption)}</div>`;
        } catch(e) {
          body = `<div class="msg-thumb-wrap"><img src="${raw}"></div>`;
        }
      } else {
        body = `<div>${_escape(raw)}</div>`;
      }

      const time = m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      const check = isSelf ? (m.is_read ? `<svg viewBox="0 0 24 24" style="stroke:var(--check-blue);"><polyline points="20 6 9 17 4 12"/></svg>` : `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`) : '';

      bubble.innerHTML = body + `<div class="msg-meta"><span>${time}</span>${check}</div>`;
      wrap.appendChild(bubble);
      cont.appendChild(wrap);
      cont.scrollTop = cont.scrollHeight;
    }

    function _escape(t) {
      return t.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    /* ЛЕНТА ПОСТОВ */
    function _onSelectPostMedia(e) {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = (ev) => {
        _postMediaFile = ev.target.result;
        _toast('Медиа прикреплено к посту!');
      };
      r.readAsDataURL(file);
    }

    async function _publishPost() {
      const t = document.getElementById('composer-text').value.trim();
      if (!t && !_postMediaFile) return _toast('Напишите текст или добавьте медиа');

      await _db.from('posts').insert({
        author_id: _currentUser.id,
        content: t || 'Публикация',
        image_url: _postMediaFile
      });

      document.getElementById('composer-text').value = '';
      _postMediaFile = null;
      _toast('Опубликовано!');
      _loadFeedStream();
    }

    async function _loadFeedStream() {
      const cont = document.getElementById('posts-stream');
      const { data: posts } = await _db.from('posts').select('*, profiles(username, avatar_url)').order('created_at', { ascending: false });
      cont.innerHTML = '';
      if (!posts || posts.length === 0) {
        cont.innerHTML = '<p style="text-align:center; color:var(--muted); font-size:13px;">В ленте пока пусто</p>';
        return;
      }

      posts.forEach(p => {
        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `
          <div class="post-header" onclick="_inspectProfile('${p.author_id}')">
            <img src="${p.profiles?.avatar_url || ''}" style="width:36px; height:36px; border-radius:50%; object-fit:cover; background:#1c222d;">
            <span style="font-weight:800; font-size:14px;">@${p.profiles?.username || 'user'}</span>
          </div>
          <div style="font-size:14px; line-height:1.45;">${_escape(p.content)}</div>
          ${p.image_url ? (p.image_url.startsWith('data:video') ? `<video class="post-media-content" src="${p.image_url}" controls playsinline></video>` : `<img class="post-media-content" src="${p.image_url}">`) : ''}
        `;
        cont.appendChild(card);
      });
    }

    /* ПРОСМОТР ПРОФИЛЯ С ВИНИЛОМ */
    async function _inspectProfile(uid) {
      _inspectedUser = _profilesCache[uid] || (await _db.from('profiles').select('*').eq('id', uid).maybeSingle()).data;
      if (!_inspectedUser) return;

      document.getElementById('v-user-name').innerText = `@${_inspectedUser.username}`;
      document.getElementById('v-user-bio').innerText = _inspectedUser.bio || 'Участник Nook';
      document.getElementById('v-user-avatar').src = _inspectedUser.avatar_url || '';

      const vBlock = document.getElementById('v-vinyl-block');
      const extBlock = document.getElementById('v-ext-music-block');
      _stopVinyl();

      if (_inspectedUser.music_type === 'vinyl') {
        vBlock.style.display = 'flex';
        extBlock.style.display = 'none';
        const tr = NOOK_TRACKS[_inspectedUser.vinyl_track || 'cyber_drift'] || NOOK_TRACKS.cyber_drift;
        document.getElementById('v-vinyl-cover').style.backgroundImage = `url('${tr.cover}')`;
        document.getElementById('v-vinyl-title').innerText = tr.title;
        document.getElementById('v-vinyl-genre').innerText = tr.genre;
      } else if (_inspectedUser.music_type === 'yandex' && _inspectedUser.music_url) {
        vBlock.style.display = 'none';
        extBlock.style.display = 'block';
        const match = _inspectedUser.music_url.match(/track\/(\d+)/);
        extBlock.innerHTML = match ? `<iframe frameborder="0" style="border:none;width:100%;height:100px;border-radius:12px;" src="https://music.yandex.ru/iframe/#track/${match[1]}"></iframe>` : '';
      } else if (_inspectedUser.music_type === 'spotify' && _inspectedUser.music_url) {
        vBlock.style.display = 'none';
        extBlock.style.display = 'block';
        const trackId = _inspectedUser.music_url.split('track/')[1]?.split('?')[0] || _inspectedUser.music_url;
        extBlock.innerHTML = `<iframe src="https://open.spotify.com/embed/track/${trackId}?theme=0" width="100%" height="80" frameBorder="0" style="border-radius:12px;"></iframe>`;
      } else {
        vBlock.style.display = 'none';
        extBlock.style.display = 'none';
      }

      document.getElementById('btn-chat-from-profile').style.display = (_currentUser.id === _inspectedUser.id) ? 'none' : 'block';
      _showModal('modal-view-user');
    }

    function _openPeerProfileFromChat() {
      if (_activeChatPeerId) _inspectProfile(_activeChatPeerId);
    }

    function _startChatFromProfile() {
      _hideModal('modal-view-user');
      if (_inspectedUser) _openChatWith(_inspectedUser.id);
    }

    /* УПРАВЛЕНИЕ ВИНИЛОВЫМ СИНТЕЗАТОРОМ */
    function _toggleVinyl() {
      const box = document.getElementById('v-vinyl-block');
      const icon = document.getElementById('v-vinyl-btn-icon');

      if (!_isPlayingVinyl) {
        _unlockAudio();
        const tr = NOOK_TRACKS[_inspectedUser?.vinyl_track || 'cyber_drift'] || NOOK_TRACKS.cyber_drift;
        let step = 0;
        const interval = Math.round((60 / tr.bpm) * 1000);

        _playSynthTone(tr.pattern[0]);
        _synthTimer = setInterval(() => {
          step = (step + 1) % tr.pattern.length;
          _playSynthTone(tr.pattern[step]);
        }, interval);

        _isPlayingVinyl = true;
        box.classList.add('playing');
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
      } else {
        _stopVinyl();
      }
    }

    function _stopVinyl() {
      if (_synthTimer) clearInterval(_synthTimer);
      _isPlayingVinyl = false;
      const box = document.getElementById('v-vinyl-block');
      const icon = document.getElementById('v-vinyl-btn-icon');
      if (box) box.classList.remove('playing');
      if (icon) icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    }

    function _playSynthTone(freq) {
      if (!_audioCtx) return;
      const t = _audioCtx.currentTime;
      const osc = _audioCtx.createOscillator();
      const gain = _audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.connect(gain);
      gain.connect(_audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.3);
    }

    /* НАСТРОЙКИ СВОЕГО ПРОФИЛЯ */
    function _openProfileHub() {
      if (!_currentUser) return _showModal('modal-auth');
      document.getElementById('edit-bio').value = _currentUser.bio || '';
      document.getElementById('edit-music-select').value = _currentUser.music_type || 'vinyl';
      document.getElementById('edit-music-url').value = _currentUser.music_url || '';
      document.getElementById('edit-avatar-preview').src = _currentUser.avatar_url || '';
      document.getElementById('edit-theme-select').value = _currentUser.app_theme || 'theme-oled';
      _onProfileMusicTypeChange();
      _showModal('modal-edit-profile');
    }

    function _onProfileMusicTypeChange() {
      const val = document.getElementById('edit-music-select').value;
      document.getElementById('edit-ext-music-row').style.display = (val === 'yandex' || val === 'spotify') ? 'block' : 'none';
    }

    let _tempAvatar = null;
    function _onAvatarChange(e) {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = (ev) => {
        _tempAvatar = ev.target.result;
        document.getElementById('edit-avatar-preview').src = ev.target.result;
      };
      r.readAsDataURL(f);
    }

    async function _saveProfileSettings() {
      const bio = document.getElementById('edit-bio').value.trim();
      const mType = document.getElementById('edit-music-select').value;
      const mUrl = document.getElementById('edit-music-url').value.trim();
      const theme = document.getElementById('edit-theme-select').value;

      const up = { bio, music_type: mType, music_url: mUrl, app_theme: theme };
      if (_tempAvatar) up.avatar_url = _tempAvatar;

      await _db.from('profiles').update(up).eq('id', _currentUser.id);
      _toast('Профиль сохранен!');
      _hideModal('modal-edit-profile');
      _syncApp();
    }

    /* ПОИСК */
    function _openSearchModal() { _showModal('modal-search'); }
    async function _onSearchTyping(e) {
      const q = e.target.value.trim().toLowerCase();
      const box = document.getElementById('search-list-box');
      if (!q) { box.innerHTML = ''; return; }

      const { data: users } = await _db.from('profiles').select('*').ilike('username', `%${q}%`).limit(15);
      box.innerHTML = '';
      if (users) {
        users.forEach(u => {
          _profilesCache[u.id] = u;
          const it = document.createElement('div');
          it.className = 'chat-item';
          it.style.padding = '8px 12px';
          it.onclick = () => { _hideModal('modal-search'); _openChatWith(u.id); };
          it.innerHTML = `<span style="font-weight:700;">@${u.username}</span>`;
          box.appendChild(it);
        });
      }
    }

    function _startCallWithPeer() {
      _toast('Вызов в защищенном P2P-канале...');
    }

    (async () => {
      _safeNetworkPing();
      _syncApp();
    })();
  </script>
</body>
</html>
